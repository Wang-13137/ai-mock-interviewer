# AI 模拟面试官 —— 集中配置
# 优先级：环境变量 > 本文件
# 环境变量写法：AIMI_ 前缀 + 双下划线分层，如 AIMI_LLM__PROVIDER=zhipu

env: dev

server:
  host: 127.0.0.1
  port: 8000

llm:
  # mock = 离线替身（无需 Key，用于跑通链路与跑测试）
  # 拿到 Key 后改成 zhipu / siliconflow / deepseek / openai
  provider: mock

  # 留空则使用该厂商的预设模型，见 core/config.py 的 PROVIDER_PRESETS
  model: ""
  base_url: ""

  # 强烈建议留空：Key 走环境变量，不进 Git
  api_key: ""

  temperature: 0.7
  max_tokens: 1024
  timeout: 30.0
  max_retries: 2

# 评委（LLM-as-judge）：**必须换成与上面不同的模型**，例如生成用 zhipu、裁判用 deepseek
judge:
  provider: mock
  model: ""
  base_url: ""
  api_key: ""
  temperature: 0.0        # 打分要稳定，固定为 0
  max_tokens: 256
  timeout: 30.0
  max_retries: 2

# Agent（工具调用）：手写 tool-call 循环，支持两种协议。max_steps 是防跑飞的安全阀
agent:
  enabled: true
  max_steps: 3
  # protocol: native    —— 把工具以 OpenAI tools 参数下发，由模型自行决定是否调用（默认，最稳）
  #            handwritten —— 把工具写成 ```tool 代码块塞进 system（兼容免费额度模型 / 评测对照）
  protocol: native
  question_bank: config/question_bank.json

# 检索策略：bm25（零依赖，默认） / vector / hybrid
# vector 与 hybrid 需要 sentence-transformers；缺失时会退化为 HashingEmbedder 替身
# （替身跑出的召回率不得对外引用，/health 会显式标记 semantic_retrieval=false）
rag:
  strategy: bm25
  embedder: auto
  # 与 src/rag/retriever.py DEFAULT_MIN_SCORE、RagConfig.min_score、README 保持一致。
  # 2026-10-16 用 bge-small-zh-v1.5 在 80 语料 × 60 评测集上标定：平台区 0.30–0.40，取上沿。
  # 评测报告即在此值下产出；改为其它值会导致运行时与公开证据不一致。
  min_score: 0.40

# System Prompt / rubric / 岗位模板的存放目录（W2 起会往里加文件）
prompts_dir: config/prompts

metrics:
  enabled: true
  path: logs/metrics.jsonl

# 数据中台：数据集登记 / 质量门禁 / content-hash 版本 / 血缘
# db 只存元数据，JSON 数据文件仍是唯一事实源；data/ 不进 Git
datahub:
  enabled: true
  db_path: data/datahub.db

# 评测中台：任务编排 / 指标落库 / 与基线的回归门禁
# gate_threshold 是相对跌幅阈值（0.02 = 2 个百分点），超过即判 regressed
evalhub:
  enabled: true
  db_path: data/evalhub.db
  # 退步判定要两个阈值同时满足：绝对差防小 baseline 的相对放大，相对差防大 baseline 的绝对钝化
  gate_threshold: 0.02        # 相对阈值（2%）
  gate_abs_threshold: 0.02    # 绝对阈值
  bootstrap_iters: 1000       # 配对重采样次数；0 = 不做显著性检验（退回点估计）
  max_concurrency: 2          # 同时跑的评测数，防互相抢 CPU / 烧额度
  run_timeout_s: 1800         # 单次 run 硬超时，防幽灵 run

# 写接口鉴权：空 = 不校验（仅本地开发）。服务对外可达时必须填。
auth:
  api_key: ""                 # 环境变量 AIMI_AUTH__API_KEY
