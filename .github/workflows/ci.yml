name: ci

on:
  push:
    # 仓库主分支实际是 master。原先只写 main，导致 push 触发的 CI 从未运行过
    # （2026-11-05 对照远程分支时发现）——这类"配置看起来对、其实没生效"的问题，
    # 只有拿实际分支名核对才会暴露。
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run tests
        # 全程跑在离线替身 EchoClient 上，CI 不需要任何 API Key
        run: pytest -q

      - name: Docs drift check
        # 真值表与文档里的用例数必须等于实际用例数，否则 CI 红
        run: python scripts/check_docs_drift.py

      - name: Smoke check (import app)
        run: python -c "from src.app import app; print('app ok', app.title, app.version)"
