name: ci

on:
  push:
    # 仓库主分支实际是 master。原先只写 main，导致 push 触发的 CI 从未运行过
    # （2026-11-05 对照远程分支时发现）——这类"配置看起来对、其实没生效"的问题，
    # 只有拿实际分支名核对才会暴露。
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run tests
        # 全程跑在离线替身 EchoClient 上，CI 不需要任何 API Key
        run: pytest -q

      - name: Regression gate (retrieval)
        # 门禁进 CI：跑一次 BM25 检索评测与固化基线（config/ci_baseline.json）比，
        # regressed / incomparable 都 exit 1 阻断。改了数据或配置时必须显式
        # `python scripts/ci_gate.py --update` 重新定基线并提交 diff——基线不许静默漂移。
        run: python scripts/ci_gate.py

      - name: Docs drift check
        # 真值表与文档里的用例数必须等于实际用例数，否则 CI 红
        run: python scripts/check_docs_drift.py

      - name: Smoke check (import app)
        run: python -c "from src.app import app; print('app ok', app.title, app.version)"

  # 语义路径单独一个 job：装 sentence-transformers + 缓存 bge 模型后跑全量。
  # 上面的基础 job 没有这个重依赖，VECTOR 用例会按 skip 规则跳过——
  # 替身（HashingEmbedder）测不了语义，这是 2026-11-05 CI 首跑失败换来的认知：
  # 与其让两个测试在无模型环境必挂，不如让"带模型的环境"成为一等公民。
  test-semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache embedding models
        # bge-small-zh-v1.5 约 100MB；key 固定，模型版本升级时手动改 key
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/sentence_transformers
          key: st-bge-small-zh-v1.5

      - name: Install deps (incl. semantic)
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-semantic.txt

      - name: Run full tests (real embedder)
        run: pytest -q
